[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbox"
version = "0.2.0"
description = "Serving-edge toolkit for LLM-in-a-Box: budgeting, admission control, caching, guardrails and resilience for vLLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Intentionally dependency-free: this runs in the request path of a UI pod.
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.37", "openai>=1.40"]
# PyYAML reads the alerting rules; promql-parser validates their expressions.
dev = ["pytest>=8.0", "pyyaml>=6.0", "promql-parser>=0.4"]

[tool.setuptools]
packages = ["llmbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
