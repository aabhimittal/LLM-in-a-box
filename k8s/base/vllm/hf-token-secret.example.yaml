# Template for the HuggingFace access token used to pull gated models
# (such as meta-llama/Meta-Llama-3-8B-Instruct).
#
# DO NOT commit the real token. Copy this file to hf-token-secret.yaml
# (git-ignored) and fill in your token, or create the secret imperatively:
#
#   kubectl -n llm-in-a-box create secret generic vllm-secrets \
#     --from-literal=HF_TOKEN='hf_xxxxxxxxxxxxxxxxxxxxx'
#
# For ungated models (e.g. mistralai/Mistral-7B-Instruct on public repos, or
# TinyLlama for CPU testing) the token can be left empty.
apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: llm-in-a-box
  labels:
    app.kubernetes.io/part-of: llm-in-a-box
    app.kubernetes.io/component: vllm
type: Opaque
stringData:
  HF_TOKEN: "REPLACE_WITH_YOUR_HUGGINGFACE_TOKEN"
