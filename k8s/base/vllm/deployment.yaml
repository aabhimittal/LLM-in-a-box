apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-in-a-box
  labels:
    app.kubernetes.io/part-of: llm-in-a-box
    app.kubernetes.io/component: vllm
    app: vllm
spec:
  replicas: 1
  # Model loading takes minutes; avoid rolling two pods that both pull weights.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        app.kubernetes.io/part-of: llm-in-a-box
        app.kubernetes.io/component: vllm
    spec:
      # Give the container enough time to shut down cleanly.
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.5.4
          imagePullPolicy: IfNotPresent
          # Serve the OpenAI-compatible API. Values come from the ConfigMap so
          # the model can be changed without editing this manifest.
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model=$(MODEL_ID)"
            - "--served-model-name=$(SERVED_MODEL_NAME)"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--gpu-memory-utilization=$(GPU_MEMORY_UTILIZATION)"
            - "--max-model-len=$(MAX_MODEL_LEN)"
            - "--tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
            # HuggingFace libraries read HUGGING_FACE_HUB_TOKEN as well.
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
            # vLLM/PyTorch use /dev/shm for inter-process tensors; the default
            # 64Mi is far too small and causes crashes under load.
            - name: shm
              mountPath: /dev/shm
          resources:
            limits:
              # Request exactly one GPU. Requires the NVIDIA device plugin to be
              # installed on the cluster (see docs/SETUP.md).
              nvidia.com/gpu: "1"
              memory: 24Gi
            requests:
              cpu: "4"
              memory: 16Gi
          # The server only becomes ready once weights are loaded, which can
          # take several minutes on first pull — hence the generous thresholds.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 60  # up to 15 minutes to load
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      # Only schedule where a GPU is actually present. Remove for CPU testing.
      # nodeSelector:
      #   nvidia.com/gpu.present: "true"
